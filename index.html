<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#fffdf9">
<title>户型装修设计</title>
<style>
:root{
  --bg:#f3efe7; --paper:#f7f4ee; --panel:#fffdf9; --line:#e3dccf; --ink:#2b2824; --muted:#8a8174;
  --accent:#b5653a; --accent-soft:#f3e3d8; --teal:#2f5d62;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);overflow:hidden;overscroll-behavior:none;touch-action:manipulation;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;
  font:13px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
button,input,select{font:inherit;color:inherit}
.app{display:grid;grid-template-rows:auto minmax(0,1fr) 30px;grid-template-columns:236px minmax(0,1fr) 300px;height:100vh;height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input{-webkit-user-select:text;user-select:text}
header{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:8px 14px;
  background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;margin-right:8px;line-height:1.25}
.brand b{font-size:15px;letter-spacing:.5px}
.brand span{color:var(--muted);font-size:12px}
.grp{display:flex;align-items:center;gap:2px;padding:2px;border:1px solid var(--line);border-radius:8px;background:#fff}
.btn{border:0;background:transparent;padding:5px 9px;border-radius:6px;cursor:pointer;white-space:nowrap}
.btn:hover{background:#f2ece2}
.btn.on{background:var(--ink);color:#fff}
.btn.chip.on{background:var(--accent-soft);color:var(--accent)}
#langSel .btn{min-width:32px;font-weight:500}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:#9f5530}
.btn.danger{color:#b3372a}
.spacer{flex:1}
aside{background:var(--panel);overflow:auto;border-right:1px solid var(--line)}
aside.right{border-right:0;border-left:1px solid var(--line)}
.lib h4{margin:0;padding:12px 14px 6px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:1px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 10px 6px}
.lib h4{position:sticky;top:0;z-index:1;background:var(--panel)}
.item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;border:1px solid var(--line);
  border-radius:8px;background:#fff;cursor:grab;user-select:none;touch-action:pan-y;transition:border-color .15s,transform .15s}
.item.dragging{border-color:var(--accent);opacity:.5}
@media (hover:hover){.item:hover{border-color:var(--accent);transform:translateY(-1px)}}
#ghost{position:fixed;left:0;top:0;z-index:30;pointer-events:none;opacity:.8;transform:translate(-50%,-50%);filter:drop-shadow(0 4px 10px rgba(40,30,20,.3))}
#ghost svg{width:100%;height:100%;display:block;overflow:visible}
.item svg{width:56px;height:44px}
.item b{font-weight:500;font-size:12px}
.item small{color:var(--muted);font-size:11px}
.hint{padding:10px 14px 16px;color:var(--muted);font-size:12px}
main{position:relative;overflow:hidden;background:var(--paper)}
#plan{width:100%;height:100%;display:block;touch-action:none;cursor:default}
#plan.panning{cursor:grabbing}
#plan.tool-measure{cursor:crosshair}
#plan .wall{pointer-events:none}
#plan.tool-demolish .wall{pointer-events:all;cursor:pointer}
#plan.tool-demolish .wall:hover{fill:#d9894f}
#plan.tool-select .room:hover{opacity:.82}
#plan .furn{cursor:move}
@media (hover:hover){#plan .furn:hover{filter:drop-shadow(0 0 2px rgba(181,101,58,.7))}}
[data-handle]{cursor:pointer}
[data-handle=size]{cursor:nwse-resize}
.scalebar{position:absolute;left:14px;bottom:12px;background:rgba(255,253,249,.92);border:1px solid var(--line);
  border-radius:8px;padding:6px 10px;font-size:12px;pointer-events:none}
.scalebar .bar{height:6px;border:1.5px solid var(--ink);border-top:0;margin-top:3px}
.modehint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:5px 12px;border-radius:20px;font-size:12px;opacity:0;transition:opacity .2s;pointer-events:none}
.modehint.show{opacity:.9}
footer{grid-column:1/-1;display:flex;gap:18px;align-items:center;padding:0 14px;background:var(--panel);overflow:hidden;white-space:nowrap;
  border-top:1px solid var(--line);color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
#tip{overflow:hidden;text-overflow:ellipsis}
footer b{color:var(--ink);font-weight:500}
#panel section{padding:12px 16px;border-bottom:1px solid var(--line)}
#panel h3{margin:0 0 8px;font-size:13px}
#panel h3 small{color:var(--muted);font-weight:400;margin-left:6px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
td{padding:4px 2px;border-bottom:1px dashed #eee6d9}
td.r{text-align:right}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf5ee}
.sw{display:inline-block;width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);vertical-align:-2px;margin-right:6px}
.total{display:flex;justify-content:space-between;margin-top:8px;font-size:14px}
.total b{color:var(--accent)}
.muted{color:var(--muted)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
.form label.full{grid-column:1/-1}
.form input,.form select{border:1px solid var(--line);border-radius:6px;padding:5px 7px;background:#fff;width:100%}
.form input[type=color]{padding:2px;height:30px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.actions .btn{border:1px solid var(--line);background:#fff}
.mats{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mat{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;padding:6px;background:#fff;cursor:pointer;text-align:left}
.mat.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.mat i{width:26px;height:26px;border-radius:5px;border:1px solid rgba(0,0,0,.12);flex:none}
.mat span{font-size:12px;line-height:1.3}
.mat small{display:block;color:var(--muted)}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px;color:var(--muted)}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f2ece2;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;color:var(--ink)}
.big{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:6px}
.stats div{background:#faf6ef;border-radius:8px;padding:8px}
.stats small{display:block;color:var(--muted);font-size:11px}
#toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;
  padding:8px 16px;border-radius:8px;opacity:0;transition:.25s;pointer-events:none;z-index:10}
#toast.show{opacity:1;transform:translateX(-50%)}
/* ---------- 2D / 3D 切换 ---------- */
.seg{position:relative;padding:3px}
.seg .btn{position:relative;z-index:1;width:82px;transition:color .45s}
.seg .btn:hover{background:transparent}
.seg .pill{position:absolute;left:3px;top:3px;bottom:3px;width:82px;border-radius:6px;background:var(--accent);
  box-shadow:0 2px 6px rgba(181,101,58,.35);transition:transform .5s cubic-bezier(.65,0,.35,1)}
.seg .btn[data-view="2d"],body.m3d .seg .btn[data-view="3d"]{color:#fff}
body.m3d .seg .btn[data-view="2d"]{color:var(--ink)}
body.m3d .seg .pill{transform:translateX(84px)}
body.busy .seg{pointer-events:none}
body.m3d .only2d,body:not(.m3d) .only3d{display:none!important}
.only2d,.only3d{animation:fadeIn .45s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
#plan{transition:opacity .45s ease,transform .45s ease}
main.is3d #plan{opacity:0;pointer-events:none}
.scalebar{transition:opacity .3s}
main.is3d .scalebar{opacity:0}
#view3d{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease,visibility 0s linear .45s}
main.is3d #view3d{opacity:1;visibility:visible;transition:opacity .45s ease}
#view3d canvas{display:block;outline:none}
#walkOverlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(30,28,25,.35);z-index:3;cursor:pointer}
#walkOverlay>div{background:var(--panel);border-radius:14px;padding:22px 28px;text-align:center;max-width:360px}
#walkOverlay h3{margin:0 0 6px}
#walkOverlay p{margin:4px 0;color:var(--muted)}
#cross{position:absolute;left:50%;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;z-index:2;display:none;pointer-events:none}
#cross:before,#cross:after{content:"";position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross:before{left:6px;top:0;width:2px;height:14px}#cross:after{top:6px;left:0;height:2px;width:14px}
#hint3d{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(43,40,36,.82);color:#fff;border-radius:20px;
  padding:5px 14px;font-size:12px;z-index:2;pointer-events:none;white-space:nowrap;transition:opacity .4s}
main.animating #hint3d{opacity:0}
.rlabel{font-size:12px;font-weight:600;color:#2b2824;background:rgba(255,253,249,.9);border:1px solid var(--line);
  border-radius:12px;padding:2px 9px;white-space:nowrap;pointer-events:auto;cursor:pointer;user-select:none;
  transition:transform .15s,background .15s,border-color .15s,box-shadow .15s,color .15s}
.rlabel:hover{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 6px 18px rgba(0,0,0,.16);transform:translateY(-2px)}
.rlabel:active{transform:scale(.95)}
.rlabel small{font-weight:400;color:var(--muted);margin-left:4px}
#roomList{padding:0 10px 6px;display:grid;grid-template-columns:1fr 1fr;gap:4px}
#roomList button{display:flex;flex-direction:column;width:100%;border:1px solid var(--line);background:#fff;padding:5px 8px;border-radius:7px;cursor:pointer;text-align:left;line-height:1.3}
#roomList button:hover{background:#f2ece2}
#roomList button.on{background:var(--accent-soft);color:var(--accent)}
#roomList small{color:var(--muted);font-variant-numeric:tabular-nums}
.range{display:flex;align-items:center;gap:6px;padding:0 8px;color:var(--muted);font-size:12px}
.range input{width:100px;accent-color:var(--accent)}
.menu{position:relative}
.menu summary{list-style:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px}
.menu summary::-webkit-details-marker{display:none}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);display:flex;flex-direction:column;min-width:150px;background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:4px;box-shadow:0 10px 30px rgba(40,30,20,.14);z-index:20;animation:fadeIn .2s ease}
.menu-pop .btn{text-align:left}
.range span{font-variant-numeric:tabular-nums;color:var(--ink)}
/* ---------- 选中后的浮动工具条 ---------- */
#fab{position:absolute;left:50%;bottom:16px;transform:translate(-50%,12px);display:flex;align-items:center;gap:4px;padding:5px;
  background:rgba(255,253,249,.97);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 26px rgba(40,30,20,.16);
  z-index:4;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s,visibility 0s linear .2s;max-width:calc(100% - 24px)}
main.drawer-panel #fab{opacity:0;visibility:hidden}
#fab.show{opacity:1;visibility:visible;transform:translate(-50%,0);transition:opacity .2s,transform .2s}
#fab .name{padding:0 8px 0 6px;font-weight:600;max-width:9em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#fab .btn{border:1px solid transparent}
#fab .sep{width:1px;align-self:stretch;margin:4px 2px;background:var(--line)}
/* ---------- 触屏漫游摇杆 ---------- */
#joy{position:absolute;left:28px;bottom:28px;width:130px;height:130px;border-radius:50%;background:rgba(255,253,249,.25);
  border:2px solid rgba(255,255,255,.7);box-shadow:0 4px 18px rgba(0,0,0,.18);z-index:3;display:none;touch-action:none;backdrop-filter:blur(3px)}
#joy i{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,253,249,.92);
  box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#walkExit{position:absolute;right:16px;bottom:28px;z-index:3;display:none}
/* ---------- 触屏：加大点击区域 ---------- */
@media (pointer:coarse){
  body{font-size:14px}
  header{padding:8px 12px;gap:8px}
  .grp{padding:3px;border-radius:10px}
  .btn{padding:8px 12px;min-height:38px;border-radius:8px}
  .seg .btn,.seg .pill{width:92px}
  body.m3d .seg .pill{transform:translateX(94px)}
  .menu summary{padding:9px 14px}
  .menu-pop .btn{padding:11px 14px}
  .item{padding:10px 4px 8px}
  .form input,.form select{font-size:16px;padding:8px 9px}
  .form input[type=color]{height:40px}
  .actions .btn,#fab .btn{min-height:42px;padding:9px 14px}
  td{padding:7px 2px}
  #roomList button{padding:8px 10px}
  .mat{padding:9px 8px}
  .range input{width:120px!important}
}
/* ---------- 竖屏 / 窄屏（如 iPad 竖握）：侧栏改为抽屉 ---------- */
/* ---------- 宽屏：左右面板可收起 ---------- */
@media (min-width:1101px){
  .app{transition:grid-template-columns .3s cubic-bezier(.3,.7,.3,1)}
  .app.hide-lib{grid-template-columns:0 minmax(0,1fr) 300px}
  .app.hide-panel{grid-template-columns:236px minmax(0,1fr) 0}
  .app.hide-lib.hide-panel{grid-template-columns:0 minmax(0,1fr) 0}
  .app.hide-lib aside.lib,.app.hide-panel aside.right{overflow:hidden;border:0}
  aside{overflow-x:hidden}
  aside.lib>div{min-width:220px} #panel{min-width:284px}   /* 收起动画中内容不被挤压变形 */
}
.narrow-only{display:none!important}
@media (max-width:1100px){
  .grp.narrow-only{display:flex!important}
  .btn.narrow-only,#fab .btn.narrow-only{display:inline-block!important}
  .app{grid-template-columns:minmax(0,1fr)}
  main,aside.lib,aside.right{grid-row:2;grid-column:1}
  aside.lib,aside.right{position:relative;z-index:6;width:min(320px,86vw);transition:transform .3s cubic-bezier(.3,.7,.3,1),box-shadow .3s}
  aside.lib{justify-self:start;transform:translateX(-110%)}
  aside.right{justify-self:end;transform:translateX(110%)}
  aside.open{transform:none;box-shadow:0 0 30px rgba(40,30,20,.18)}
  .lib-grid{grid-template-columns:1fr 1fr 1fr}
  .brand span,footer .only2d{display:none!important}
}
/* ---------- 户型编辑 / 户型图 ---------- */
#gImg,#gPlan{pointer-events:none}
#plan.tool-plan,#plan.tool-wall,#plan.tool-room,#plan.tool-roomPoly,#plan.tool-opening,#plan.tool-calib{cursor:crosshair}
#opKind{max-width:7em;font-size:12px;padding:4px 4px}
.prow{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 8px}
.pchip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer}
.pchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.grpHint{font-size:12px;color:var(--muted);line-height:1.5}
@media (max-width:1100px){
  #planTools{overflow-x:auto}
  #snapTools{flex:0 0 100%}
  .pchip{padding:7px 12px}
}
/* ---------- 户型库 / 自动贴合 / 网格 ---------- */
#snapTools{gap:6px}
.glabel{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap}
.glabel .slim{font-size:12px;padding:4px 4px}
.libtabs{display:flex;gap:4px;padding:8px 10px 2px}
.ltab{flex:1;border:0;background:#f2ece2;color:var(--muted);padding:6px 0;border-radius:7px;cursor:pointer;font-size:12px;font-family:inherit}
.ltab.on{background:var(--ink);color:#fff}
#libPlan[hidden]{display:none!important}
.plib{display:flex;flex-direction:column;gap:6px;padding:0 10px 8px}
.pitem{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:5px 8px;cursor:grab;user-select:none;touch-action:pan-y}
.pitem.dragging{border-color:var(--accent);opacity:.5}
.pitem svg{width:38px;height:28px;flex:0 0 38px}
.pitem b{font-size:12px;font-weight:600}
.pitem small{margin-left:auto;color:var(--muted);font-size:11px}
#ghost svg{width:100%;height:100%;display:block}
</style>

<body>
<div class="app">
  <header>
    <div class="grp" id="paneBtns">
      <button class="btn chip" id="tgLib" data-en="◧ Library">◧ 家具库</button>
      <button class="btn chip" id="tgPanel" data-en="Properties ◨">属性 ◨</button>
    </div>
    <div class="brand"><b data-en="3BR 2LR 2BA · Interior Design">三室两厅两卫 · 装修设计</b><i id="ver" style="font-style:normal;font-size:11px;color:#8a857c;border:1px solid var(--line);border-radius:6px;padding:1px 5px;margin-left:6px">v2.4 · 一键布置 + 导出 DXF 不乱码</i><span id="subtitle">原始户型 1:60 · 尺寸单位 mm</span></div>
    <div class="grp seg" id="viewSeg" title="切换 2D / 3D (T)" data-en-title="Switch 2D / 3D (T)">
      <span class="pill"></span>
      <button class="btn" data-view="2d" data-en="2D Plan">2D 平面</button>
      <button class="btn" data-view="3d" data-en="3D Scene">3D 场景</button>
    </div>
    <div class="grp only2d" id="tools">
      <button class="btn on" data-tool="select" title="选择 / 移动 (V)" data-en-title="Select / Move (V)" data-en="Select">选择</button>
      <button class="btn" data-tool="measure" title="测量 (M)" data-en-title="Measure (M)" data-en="Measure">测量</button>
      <button class="btn" data-tool="demolish" title="拆改非承重墙 (X)" data-en-title="Demolish non-bearing walls (X)" data-en="Demolish">拆改墙体</button>
    </div>
    <div class="grp only2d" id="furnGrp">
      <button class="btn primary" id="autoFurnTop" title="一键布置家具：按房间用途给每个房间摆成套家具，摆完还能拖着微调" data-en-title="Auto-furnish: lay out a full set of furniture in every room (drag to fine-tune afterwards)" data-en="🛋 Furnish">🛋 一键布置家具</button>
    </div>
    <div class="grp only2d" id="planTools">
      <button class="btn" data-tool="plan" title="编辑户型 (P)：点选墙体 / 门窗 / 房间，拖动手柄改尺寸、拖动墙段整体平移" data-en-title="Edit plan (P): pick a wall, opening or room and drag its grips" data-en="✎ Plan">✎ 户型</button>
      <button class="btn" data-tool="wall" title="画墙 (W)：从起点拖到终点，自动吸附已有墙线" data-en-title="Draw wall (W): drag from start to end" data-en="Wall">画墙</button>
      <button class="btn" data-tool="room" title="画房间 (G)：拖出一个矩形房间" data-en-title="Draw room (G): drag out a rectangular room" data-en="Room">画房间</button>
      <button class="btn" data-tool="opening" title="开洞 (O)：贴着已有墙体拖出窗 / 门 / 推拉门" data-en-title="Opening (O): drag along an existing wall" data-en="Opening">开洞</button>
      <select id="opKind" class="slim" title="开洞类型 / Opening type">
        <option value="win" data-en="Window">窗</option>
        <option value="door" data-en="Door">门</option>
        <option value="slide" data-en="Slider">推拉门</option>
      </select>
      <details class="menu" id="planMenu"><summary class="btn" data-en="Floor plan ▾">户型图 ▾</summary>
        <div class="menu-pop">
          <button class="btn" id="imgImport" data-en="Import floor-plan image…">导入户型图图片…</button>
          <button class="btn" id="imgCalib" data-en="Calibrate scale (2 points)">两点标定比例</button>

function applyGeom(g){
  if (!g || !Array.isArray(g.walls)) return;
  const c = deepClone(g);
  const put = (a, b) => { a.length = 0; (b || []).forEach(x => a.push(x)); };
  put(WALLS, c.walls); put(WINS, c.wins); put(DOORS, c.doors); put(SLIDES, c.slides); put(ROOMS, c.rooms);
  ROOMS.forEach(r => { if (r.at && !pointInPoly({x:r.at[0], y:r.at[1]}, r.poly)) r.at = centroid(r.poly); });
  ROOMS.forEach(r => { if (!state.rooms[r.id]) state.rooms[r.id] = {name:r.name, mat:r.mat || 'tile800'}; });
  Object.keys(state.rooms).forEach(id => { if (!ROOMS.some(r => r.id === id)) delete state.rooms[id]; });

 *  尺寸跟着房间净尺寸收缩，保证不越界；摆完照样可以拖动微调。

function fput(list, bb, type, name, w, d, side, off, color, gap){

  if (side === 'N' || side === 'S'){
    w = Math.min(w, Math.max(200, bw - 60)); d = Math.min(d, Math.max(200, bh - 60));
    cx = bb[0] + bw/2 + off;
    cy = side === 'N' ? bb[1] + gap + d/2 : bb[3] - gap - d/2;
    rot = side === 'N' ? 0 : 180;
  } else {
    const w2 = Math.min(w, Math.max(200, bh - 60)), d2 = Math.min(d, Math.max(200, bw - 60));
    w = w2; d = d2;
    cy = bb[1] + bh/2 + off;
    cx = side === 'W' ? bb[0] + gap + d/2 : bb[2] - gap - d/2;
    rot = side === 'W' ? 270 : 90;
  }
  list.push(F(type, name, Math.round(cx), Math.round(cy), Math.round(w), Math.round(d), rot, color));
}
function fputAt(list, type, name, w, d, x, y, rot, color){

}
function roomKind(r){

  if (/kitchen|厨/.test(t)) return 'kitchen';
  if (/dining|餐厅/.test(t)) return 'dining';
  if (/living|客厅/.test(t)) return 'living';
  if (/laundry|洗衣/.test(t)) return 'laundry';                 // 洗衣阳台要排在“阳台”之前
  if (/balcony|阳台/.test(t)) return 'balcony';

function sideBlocked(bb, side, kinds){

    const cx = (r[0]+r[2])/2, cy = (r[1]+r[3])/2;
    if (side === 'N') return Math.abs(cy - bb[1]) < tol && cx > bb[0]-300 && cx < bb[2]+300;
    if (side === 'S') return Math.abs(cy - bb[3]) < tol && cx > bb[0]-300 && cx < bb[2]+300;
    if (side === 'W') return Math.abs(cx - bb[0]) < tol && cy > bb[1]-300 && cy < bb[3]+300;
    return Math.abs(cx - bb[2]) < tol && cy > bb[1]-300 && cy < bb[3]+300;
  };
  if (k.indexOf('d') >= 0 && DOORS.some(o => near(o.rect))) return true;
  if (k.indexOf('w') >= 0 && WINS.some(o => near(o))) return true;
  return false;
}

function sideGap(bb, side, want){
  const horiz = side === 'N' || side === 'S';
  const lo = horiz ? bb[0] : bb[1], hi = horiz ? bb[2] : bb[3];
  const near = r => {
    const cx = (r[0]+r[2])/2, cy = (r[1]+r[3])/2;
    if (side === 'N') return Math.abs(cy - bb[1]) < 380;
    if (side === 'S') return Math.abs(cy - bb[3]) < 380;
    if (side === 'W') return Math.abs(cx - bb[0]) < 380;
    return Math.abs(cx - bb[2]) < 380;
  };
  const holes = [];
  const add = r => { if (near(r)) holes.push([horiz ? r[0] : r[1], horiz ? r[2] : r[3]]); };
  DOORS.forEach(o => add(o.rect)); SLIDES.forEach(s => add(s.rect));
  holes.sort((a,b) => a[0]-b[0]);
  const gaps = []; let cur = lo;
  for (const h of holes){ if (h[0] > cur) gaps.push([cur, Math.min(h[0], hi)]); cur = Math.max(cur, h[1]); }
  if (hi > cur) gaps.push([cur, hi]);
  let best = [(lo+hi)/2, Math.max(300, hi-lo)], bd = 1e9;

    const L = gp[1]-gp[0], d = Math.abs(L - want) + (L < want ? 900 : 0);

    P('fridge','冰箱', 700, 700, cs, (cs === 'N' || cs === 'S') ? -(W-1200)/2 : -(H-1200)/2);
    return;
  }
  if (kind === 'kitchen'){                                         // 厨房：L 形橱柜 + 水槽 / 灶台 + 冰箱
    const s1 = pickSide(bb, [H >= W ? 'W' : 'N', 'N', 'W', 'E'], 'dw');
    const l1 = s1 === 'N' || s1 === 'S';
    P('counter','橱柜台面', (l1 ? W : H) - 100, 600, s1, 0);
    const s2 = (s1 === 'W' || s1 === 'E') ? 'N' : 'W';
    const l2 = s2 === 'N' || s2 === 'S';
    P('counter','橱柜台面', ((l2 ? W : H) - 100) * .5, 600, s2, l2 ? -W*.25 : -H*.25);
    P('ksink','水槽', 800, 450, s1, l1 ? -W*.22 : -H*.22, 0, 20);
    P('stove','燃气灶', 750, 450, s1, l1 ? W*.22 : H*.22, 0, 20);
    P('fridge','冰箱', 700, 700, s2, l2 ? W*.36 : H*.36);
    return;
  }
  if (kind === 'bath'){                                            // 卫生间：淋浴房 + 马桶 + 浴室柜
    const order = W >= H ? ['W','E','N','S'] : ['N','S','W','E'];
    const s1 = pickSide(bb, order, 'dw'), i0 = order.indexOf(s1);
    const s2 = order[(i0+1)%4], s3 = order[(i0+2)%4];
    P('shower','淋浴房', Math.min(950, H-250), Math.min(950, W-250), s1, 0);
    P('toilet','马桶', 420, 700, s2, 0);
    P('vanity','浴室柜', Math.min(1000, W-500), 500, s3, 0);
    return;
  }
  if (kind === 'laundry'){                                         // 洗衣房
    P('washer','洗衣机', 600, 600, 'W', 0);
    P('vanity','洗手池', 800, 500, pickSide(bb, ['N','S','E'], 'dw'), 0);
    if (W >= 1900) P('cabinet','储物柜', 900, 400, 'E', 0);
    return;
  }
  if (kind === 'balcony'){                                         // 休闲阳台：茶桌居中，椅子沿长边摆（窄阳台也放得下）
    const cx = (bb[0]+bb[2])/2, cy = (bb[1]+bb[3])/2;
    const tw = Math.min(700, Math.max(320, Math.min(W, H) - 240));
    const sw = Math.min(700, (H >= W ? W : H) - 100);
    fputAt(list, 'roundtable', '茶桌', tw, tw, cx, cy, 0);
    const step = Math.min((H >= W ? H : W)/2 - tw/2 - 380, 900);
    if (step > 420){
      if (H >= W){
        fputAt(list, 'armchair', '休闲椅', sw, 700, cx, cy - step, 90, '#d6b99a');
        fputAt(list, 'armchair', '休闲椅', sw, 700, cx, cy + step, 270, '#d6b99a');
      } else {
        fputAt(list, 'armchair', '休闲椅', 700, sw, cx - step, cy, 0, '#d6b99a');
        fputAt(list, 'armchair', '休闲椅', 700, sw, cx + step, cy, 180, '#d6b99a');
      }
    }
    if (H >= W ? H > 3200 : W > 3200) fputAt(list, 'plant', '绿植', 500, 500, cx, bb[1] + 300, 0);
    return;
  }
  P('shoecab','鞋柜', Math.min(1200, W-400), 350, pickSide(bb, ['N','S','E','W'], 'd'), 0);   // 玄关 / 其它
  P('plant','绿植', 500, 500, 'W', 0);
}
/* 把本房间的家具压进房间包围盒里（留 60mm 墙边），过大就按房间尺寸缩，避免家具穿墙 */
function fitFurn(list, poly){
  const bb = bbox(poly), M = 60;
  list.forEach(f => {
    const rot = ((f.rot % 360) + 360) % 360, sw = (rot === 90 || rot === 270);
    const limX = (bb[2] - bb[0]) - 2*M, limY = (bb[3] - bb[1]) - 2*M;
    if (sw){ f.d = Math.min(f.d, limX); f.w = Math.min(f.w, limY); }
    else { f.w = Math.min(f.w, limX); f.d = Math.min(f.d, limY); }
    f.w = Math.max(120, Math.round(f.w)); f.d = Math.max(120, Math.round(f.d));
    const hw = (sw ? f.d : f.w)/2, hh = (sw ? f.w : f.d)/2;
    f.cx = Math.round(Math.min(Math.max(f.cx, bb[0] + M + hw), bb[2] - M - hw));
    f.cy = Math.round(Math.min(Math.max(f.cy, bb[1] + M + hh), bb[3] - M - hh));
  });
  return list;
}
/* 判断一份家具列表是否就是代码里的原始示例布置（说明用户没自己摆过） */
function sameAsSample(list){
  const d = defaultFurniture();
  if (!Array.isArray(list) || list.length !== d.length) return false;
  return d.every((a, i) => list[i] && list[i].type === a.type && Math.abs(list[i].cx - a.cx) < 5 && Math.abs(list[i].cy - a.cy) < 5);
}
/* 启动时：空布置、或还留着代码里的原始示例布置 → 直接换成按房间用途的成套布置（用户的改动不会被动） */
function initFurnish(){
  if (state.furniture.length && !sameAsSample(state.furniture)) return false;
  const l = autoFurnishList();
  if (!l.length) return false;
  state.furniture = l;
  return true;
}
function furnishRoomList(r){ const l = []; furnishRoom(l, r); return fitFurn(l, r.poly); }
function autoFurnishList(){
  const l = [];
  ROOMS.forEach(r => { const one = []; furnishRoom(one, r); fitFurn(one, r.poly); one.forEach(f => l.push(f)); });
  return l;
}
function furnishAll(){
  mutate(() => { state.furniture = autoFurnishList(); });
  toast(tr('已按房间用途布置好全部家具，可继续拖动微调', 'Furniture arranged for every room — drag to fine-tune'));
}
function furnishOne(){
  const room = ROOMS.find(r => r.id === ui.sel?.id);
  if (!room){ toast(tr('先选中一个房间', 'Select a room first')); return; }
  const keep = state.furniture.filter(f => !pointInPoly({x:f.cx, y:f.cy}, room.poly));
  const add = furnishRoomList(room);
  mutate(() => { state.furniture = keep.concat(add); });
  toast(tr('已布置「' + nm(room.name) + '」', 'Room furnished'));
}

function defaultState(){
  const rooms = {}; ROOMS.forEach(r => rooms[r.id] = {name:r.name, mat:r.mat});
  return {furniture:defaultFurniture(), rooms, demolished:[], measures:[], plan:deepClone(PLAN0), img:null};
}

const STORE = 'huxing-design-v1';
function load(){
  try { const s = JSON.parse(localStorage.getItem(STORE)); if (s && Array.isArray(s.furniture)) return fixState(s); } catch(e) {}
  return null;
}
function fixState(s){
  const d = defaultState();
  s.rooms = Object.assign(d.rooms, s.rooms || {});
  s.demolished = s.demolished || []; s.measures = s.measures || [];
  if (!s.plan || !Array.isArray(s.plan.walls)) s.plan = deepClone(PLAN0);      // 旧方案：补上默认户型
  if (!Array.isArray(s.plan.rooms) || !s.plan.rooms.length) s.plan.rooms = deepClone(PLAN0.rooms);
  if (s.img === undefined) s.img = null;
  if (s.img && !s.img.src) s.img = null;
  return s;
}

function undo(){ if (!undoStack.length) return toast(tr('没有可撤销的操作', 'Nothing to undo')); redoStack.push(snap()); state = JSON.parse(undoStack.pop()); syncGeomFromState(); validateSel(); save(); renderAll(); }
function redo(){ if (!redoStack.length) return; undoStack.push(snap()); state = JSON.parse(redoStack.pop()); syncGeomFromState(); validateSel(); save(); renderAll(); }
function validateSel(){
  const s = ui.sel; if (!s) return;
  if (s.kind === 'furn'){ if (!getF(s.id)) ui.sel = null; return; }
  if (s.kind === 'room'){ if (!ROOMS.some(r => r.id === s.id)) ui.sel = null; return; }
  if (s.kind === 'img'){ if (!state.img) ui.sel = null; return; }
  if (PLAN_KINDS.includes(s.kind)){
    const n = s.kind === 'wall' ? WALLS.length : s.kind === 'win' ? WINS.length : s.kind === 'slide' ? SLIDES.length : DOORS.length;

/* ======================= 几何工具 ======================= */
const area = poly => Math.abs(poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + p[0]*q[1] - q[0]*p[1]; }, 0)) / 2 / 1e6;
const perim = poly => poly.reduce((a,p,i) => { const q = poly[(i+1)%poly.length]; return a + Math.hypot(q[0]-p[0], q[1]-p[1]); }, 0) / 1000;
const bbox = poly => { const xs = poly.map(p=>p[0]), ys = poly.map(p=>p[1]); return [Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]; };
function aabb(f){ const a = f.rot*Math.PI/180, c = Math.abs(Math.cos(a)), s = Math.abs(Math.sin(a)); return {hw:f.w/2*c + f.d/2*s, hh:f.w/2*s + f.d/2*c}; }
const fmt = (n, d=2) => n.toFixed(d);
const norm = a => ((Math.round(a) % 360) + 360) % 360;
function snapRects(){ return WALLS.filter((w,i) => !state.demolished.includes('w'+i)).concat(WINS); }

/* ======================= 颜色 / 材质图案 ======================= */
function hex2rgb(h){ h = h.replace('#',''); if (h.length===3) h = h.split('').map(c=>c+c).join(''); const n = parseInt(h,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
function shade(h,k){ const f = v => Math.max(0,Math.min(255,Math.round(k>1 ? v+(255-v)*(k-1)*2 : v*k))); return '#'+hex2rgb(h).map(v=>f(v).toString(16).padStart(2,'0')).join(''); }

/* ======================= 家具图例 ======================= */
const ST = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
const rc = (x,y,w,h,f,ex='') => `<rect x="${x}" y="${y}" width="${Math.max(0,w)}" height="${Math.max(0,h)}" fill="${f}" ${ST} ${ex}/>`;
const ec = (cx,cy,rx,ry,f,ex='') => `<ellipse cx="${cx}" cy="${cy}" rx="${Math.max(0,rx)}" ry="${Math.max(0,ry)}" fill="${f}" ${ST} ${ex}/>`;
const ln = (x1,y1,x2,y2,ex='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" ${ST} ${ex}/>`;
const pa = (d,f='none',ex='') => `<path d="${d}" fill="${f}" ${ST} ${ex}/>`;
const DASH = 'stroke-dasharray="4 3"';

function furnSVG(t,w,d,c){

      const ph = Math.min(360,d*.18), py = y+150;
      if (w >= 1300){ const pw = (w-240)/2; s += rc(x+80,py,pw,ph,'#fff','rx="70"') + rc(x+160+pw,py,pw,ph,'#fff','rx="70"'); }
      else s += rc(x+80,py,w-160,ph,'#fff','rx="70"');
      const by = py+ph+110, bh = y+d-15-by;
      s += rc(x+15,by,w-30,bh,c,'rx="40"') + pa(`M${x+15} ${by+300}H${x+w-15}`,'none',DASH);
      s += pa(`M${x+w-15-Math.min(420,w*.3)} ${by}L${x+w-15} ${by}L${x+w-15} ${by+Math.min(420,w*.3)}Z`, shade(c,1.12));

      let s = rc(x,y,w,d,dk,'rx="60"');

    case 'toilet': return rc(x+w*.04,y,w*.92,d*.27,c,'rx="30"') + ec(0,y+d*.27+d*.36,w*.47,d*.36,c) + ec(0,y+d*.27+d*.4,w*.3,d*.24,'#eef4f7');
    case 'vanity': return rc(x,y,w,d,c,'rx="20"') + ec(0,y+d*.57,Math.min(w*.32,260),d*.28,'#fff') + `<circle cx="0" cy="${y+d*.17}" r="26" fill="#999"/>`;
    case 'shower': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d,DASH) + ln(x+w,y,x,y+d,DASH) + `<circle r="45" fill="#fff" ${ST}/>`;
    case 'bathtub': return rc(x,y,w,d,c,'rx="40"') + rc(x+80,y+80,w-160,d-160,'#fff',`rx="${m*.33}"`) + `<circle cx="${x+w-260}" cy="0" r="35" fill="#ccc" ${ST}/>`;
    case 'washer': case 'dryer': return rc(x,y,w,d,c,'rx="30"') + rc(x,y,w,d*.14,shade(c,.9)) + `<circle cy="${d*.06}" r="${m*.34}" fill="#fff" ${ST}/><circle cy="${d*.06}" r="${m*.24}" fill="${t==='dryer'?'#e9dccb':'#cfdde4'}" ${ST}/>`;
    case 'crib': {
      let s = rc(x,y,w,d,c,'rx="20"') + rc(x+45,y+45,w-90,d-90,'#fff','rx="20"');
      for (let sx = x+90; sx < x+w-60; sx += 90) s += ln(sx,y,sx,y+45,'opacity=".5"') + ln(sx,y+d-45,sx,y+d,'opacity=".5"');
      return s;
    }
    case 'beanbag': return ec(0,0,w/2,d/2,c) + ec(-w*.04,-d*.06,w*.3,d*.28,shade(c,1.12),'opacity=".9"');
    case 'sidetable': return ec(0,0,w/2,d/2,c) + ec(0,0,w*.12,d*.12,'none','opacity=".5"');
    case 'floorlamp': return `<circle r="${m*.5}" fill="#fff6dd" fill-opacity=".85" ${ST}/>` + `<circle r="${m*.32}" fill="none" ${ST} ${DASH}/>` + `<circle r="${m*.07}" fill="${c}" ${ST}/>`;
    case 'island': return rc(x,y,w,d,c) + ln(x,y+d-250,x+w,y+d-250,DASH);
    case 'barstool': return `<circle r="${m/2}" fill="${c}" ${ST}/><circle r="${m*.3}" fill="${shade(c,1.15)}" ${ST}/>`;
    case 'waterheater': return rc(x,y,w,d,c,`rx="${d/2}" ${DASH}`) + ln(x+w*.2,0,x+w*.8,0,DASH);
    case 'tv': return rc(x,y,w,d,c,'rx="10"') + rc(x+w*.3,y+d,w*.4,Math.min(40,d),'#666');
    case 'aircon': return rc(x,y,w,d,c,'rx="30"') + ln(x+40,y+d*.72,x+w-40,y+d*.72) + ln(x+40,y+d*.86,x+w-40,y+d*.86);
    case 'acwall': {
      let s = rc(x,y,w,d,c,`rx="30" ${DASH}`);
      [.25,.5,.75].forEach(k => s += ln(x+w*k,y+d,x+w*k,y+d+200,`${DASH} opacity=".6"`));
      return s;
    }
    case 'dishwasher': return rc(x,y,w,d,c,'rx="15"') + ln(x,y+d-70,x+w,y+d-70) + rc(x+w*.3,y+d-45,w*.4,25,'#888');
    case 'ovencol': return rc(x,y,w,d,c) + ln(x,y,x+w,y+d) + ln(x+w,y,x,y+d);
    case 'purifier': return rc(x,y,w,d,c,'rx="60"') + rc(x+45,y+45,w-90,d-90,'none',`rx="40" ${DASH}`);
    case 'officechair': {
      let s = '';
      for (let k = 0; k < 5; k++) s += `<line x1="0" y1="0" x2="0" y2="${m*.48}" transform="rotate(${k*72+36})" stroke="#555" stroke-width="2" vector-effect="non-scaling-stroke"/>`;
      return s + rc(x+w*.12,y+d*.22,w*.76,d*.66,c,'rx="80"') + rc(x+w*.15,y+d*.04,w*.7,d*.16,shade(c,.78),'rx="40"')
        + rc(x+w*.02,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"') + rc(x+w*.88,y+d*.3,w*.1,d*.45,shade(c,.7),'rx="30"');
    }
    case 'piano': {
      let s = rc(x,y,w,d*.55,c,'rx="10"') + rc(x+40,y+d*.55,w-80,d*.4,shade(c,1.4),'rx="10"');
      const kx = x+90, kw = w-180, kd = d*.2;
      s += rc(kx,y+d*.55,kw,kd,'#faf8f3');
      for (let i = 1; i < 26; i++) s += ln(kx+kw*i/26,y+d*.55,kx+kw*i/26,y+d*.55+kd,'opacity=".5"');
      return s;
    }
    case 'treadmill': return rc(x,y,w,d,c,'rx="50"') + rc(x+90,y+320,w-180,d-400,'#1c1c1e','rx="25"') + rc(x,y,w,230,shade(c,1.4),'rx="40"');
    default: return rc(x,y,w,d,c);
  }
}

const NOLABEL = ['plant','floorlamp','sidetable','barstool','beanbag'];
function renderRooms(){
  let s = '';
  ROOMS.forEach(r => s += `<polygon class="room" data-room="${r.id}" points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="url(#m-${state.rooms[r.id].mat})"/>`);
  const sill = ([a,b,c,d]) => `<rect x="${a}" y="${b}" width="${c-a}" height="${d-b}" fill="#e2dacb" stroke="#b9b0a0" stroke-width="1" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  DOORS.forEach(d => s += sill(d.rect)); SLIDES.forEach(d => s += sill(d.rect));
  $('#gRooms').innerHTML = s;
}

function renderFurn(){
  const g = $('#gFurn');
  g.setAttribute('display', ui.layers.furn ? 'inline' : 'none');
  g.innerHTML = state.furniture.map(f => {
    const fs = Math.max(80, Math.min(170, Math.min(f.w,f.d)*.2));
    const label = Math.min(f.w,f.d) >= 380 && !NOLABEL.includes(f.type)
      ? `<text transform="rotate(${-f.rot})" font-size="${fs}" text-anchor="middle" dominant-baseline="central" fill="#4a443c" opacity=".8" pointer-events="none">${esc(nm(f.name))}</text>` : '';
    return `<g class="furn" data-fid="${f.id}" transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">${furnSVG(f.type,f.w,f.d,f.color)}${label}</g>`;
  }).join('');
}

function renderWalls(){
  $('#gWalls').innerHTML = WALLS.map((w,i) => {
    const [x0,y0,x1,y1,k] = w, id = 'w'+i, dem = state.demolished.includes(id);
    let fill = k==='b' ? (ui.layers.bearing ? '#b8412c' : '#26241f') : k==='low' ? '#e9e3d8' : k==='e' ? '#8f897d' : '#a7a195';
    let ex = k==='low' ? 'stroke="#8f897d" stroke-width="1" vector-effect="non-scaling-stroke"' : '';
    if (dem){ fill = 'rgba(198,91,58,.12)'; ex = 'stroke="#c65b3a" stroke-width="1.2" stroke-dasharray="5 3" vector-effect="non-scaling-stroke"'; }
    return `<rect class="wall" data-wall="${id}" x="${x0}" y="${y0}" width="${x1-x0}" height="${y1-y0}" fill="${fill}" ${ex}/>`;
  }).join('');
}

function renderOpenings(){
  const WS = 'stroke="#4f7394" stroke-width="1" vector-effect="non-scaling-stroke"';
  let s = '';
  WINS.forEach(([x0,y0,x1,y1]) => {
    const w = x1-x0, h = y1-y0;
    s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="#f7fbfd" ${WS}/>`;
    if (w >= h) [1/3,2/3].forEach(t => s += `<line x1="${x0}" y1="${y0+h*t}" x2="${x1}" y2="${y0+h*t}" ${WS}/>`);
    else [1/3,2/3].forEach(t => s += `<line x1="${x0+w*t}" y1="${y0}" x2="${x0+w*t}" y2="${y1}" ${WS}/>`);
  });
  const DS = 'stroke="#3d3a34" stroke-width="1" vector-effect="non-scaling-stroke"';
  DOORS.forEach(d => {
    const [hx,hy] = d.h, L = d.len, T = 40;
    const ox = hx + d.o[0]*L, oy = hy + d.o[1]*L, cx = hx + d.c[0]*L, cy = hy + d.c[1]*L;
    const sweep = d.o[0]*d.c[1] - d.o[1]*d.c[0] > 0 ? 1 : 0;
    const col = d.entry ? '#b5653a' : '#3d3a34';
    s += `<polygon points="${hx},${hy} ${ox},${oy} ${ox+d.c[0]*T},${oy+d.c[1]*T} ${hx+d.c[0]*T},${hy+d.c[1]*T}" fill="#fff" stroke="${col}" stroke-width="${d.entry?1.8:1}" vector-effect="non-scaling-stroke"/>`;
    s += `<path d="M${ox} ${oy}A${L} ${L} 0 0 ${sweep} ${cx} ${cy}" fill="none" ${DS} stroke-dasharray="5 3" opacity=".7"/>`;
  });
  SLIDES.forEach(({rect:[x0,y0,x1,y1],v}) => {
    if (v){ const L = y1-y0, m = (x0+x1)/2; s += `<rect x="${m-45}" y="${y0}" width="40" height="${L*.55}" fill="#fff" ${DS}/><rect x="${m+5}" y="${y1-L*.55}" width="40" height="${L*.55}" fill="#fff" ${DS}/>`; }
    else { const L = x1-x0, m = (y0+y1)/2; s += `<rect x="${x0}" y="${m-45}" width="${L*.55}" height="40" fill="#fff" ${DS}/><rect x="${x1-L*.55}" y="${m+5}" width="${L*.55}" height="40" fill="#fff" ${DS}/>`; }
  });
  // 入户标识：跟着入户门走（沿开启方向的反方向朝室外画箭头）
  const ed = DOORS.find(d => d.entry);
  if (ed){
    const [ex0,ey0,ex1,ey1] = ed.rect, mx = (ex0+ex1)/2, my = (ey0+ey1)/2;
    const nx = -ed.o[0], ny = -ed.o[1], A = 170, tx = -ny, ty = nx;
    const ax = mx + nx*350, ay = my + ny*350, bx = mx + nx*1500, by = my + ny*1500;
    const p1 = `${ax + nx*A + tx*A},${ay + ny*A + ty*A}`, p2 = `${ax + nx*A - tx*A},${ay + ny*A - ty*A}`;
    s += `<path d="M${bx} ${by}L${ax} ${ay}" fill="none" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke"/>
        <polygon points="${ax},${ay} ${p1} ${p2}" fill="#b5653a"/>
        <text x="${bx}" y="${by - 120}" font-size="200" fill="#b5653a">${tr('入户','Entry')}</text>`;
  }
  $('#gOpen').innerHTML = s;
}

function renderLabels(){

      <text x="${x}" y="${y+260}" font-size="175" text-anchor="middle" fill="#7d7366" ${halo}>${fmt(area(r.poly))} m²</text>`;

}

function renderDims(){
  const DC = '#7d7160', LS = `stroke="${DC}" stroke-width="1" vector-effect="non-scaling-stroke"`, TK = `stroke="${DC}" stroke-width="2" vector-effect="non-scaling-stroke"`;
  const txt = (x,y,v,rot) => `<text x="${x}" y="${y}" font-size="${v<400?140:200}" text-anchor="middle" fill="${DC}" ${rot?`transform="rotate(-90 ${x} ${y})"`:''}>${v}</text>`;
  const chain = (horiz, at, start, segs) => {
    const pts = [start]; segs.forEach(v => pts.push(pts[pts.length-1]+v));
    let s = horiz ? `<line x1="${pts[0]}" y1="${at}" x2="${pts.at(-1)}" y2="${at}" ${LS}/>` : `<line x1="${at}" y1="${pts[0]}" x2="${at}" y2="${pts.at(-1)}" ${LS}/>`;
    pts.forEach(p => s += horiz
      ? `<line x1="${p}" y1="${at-170}" x2="${p}" y2="${at+170}" ${LS}/><line x1="${p-80}" y1="${at+80}" x2="${p+80}" y2="${at-80}" ${TK}/>`
      : `<line x1="${at-170}" y1="${p}" x2="${at+170}" y2="${p}" ${LS}/><line x1="${at-80}" y1="${p+80}" x2="${at+80}" y2="${p-80}" ${TK}/>`);
    segs.forEach((v,i) => { const mid = (pts[i]+pts[i+1])/2; s += horiz ? txt(mid, at-70, v) : txt(at-70, mid, v, true); });
    return s;
  };
  const g = $('#gDims');
  // 户型被改动过以后，原来那几条固定尺寸链就对不上了 —— 改成按当前几何自动标注
  const autoDims = () => {
    const bb = geomBounds(), out = [];
    out.push(chain(true, bb.y - 620, bb.x, [Math.round(bb.w)]));
    out.push(chain(false, bb.x - 620, bb.y, [Math.round(bb.h)]));
    const seen = new Set();
    ROOMS.forEach(r => {
      if (!r.at) return;
      const b = bbox(r.poly), w = Math.round(b[2]-b[0]), h = Math.round(b[3]-b[1]);
      const kx = `h${Math.round(b[1])}:${w}`, ky = `v${Math.round(b[2])}:${h}`;
      if (w > 300 && !seen.has(kx)){ seen.add(kx); out.push(chain(true, b[1] - 260, b[0], [w])); }
      if (h > 300 && !seen.has(ky)){ seen.add(ky); out.push(chain(false, b[2] + 260, b[1], [h])); }
    });
    return out.join('');
  };
  g.innerHTML = planDirty() ? autoDims() :
    chain(true,-750,0,[1580,240,2760,240,1540,240,3670]) + chain(true,-1250,0,[10270]) +
    chain(true,11350,0,[2180,240,2160,240,5450,240,1340]) + chain(true,11850,0,[11850]) +
    chain(false,-800,0,[3370,1580,240,2770,240,2360]) + chain(false,-1300,0,[10560]) +
    chain(false,12750,0,[3370,240,2760,240,3950]) + chain(false,13250,0,[10560]);
  g.setAttribute('display', ui.layers.dims ? 'inline' : 'none');
}

function renderGrid(){
  const bb = planBounds(2500), G = Math.max(10, ui.grid);
  const bg = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="transparent" data-bg="1"/>`;
  if (!ui.layers.grid){ $('#gGrid').innerHTML = bg; return; }
  // 网格按 ui.grid 的疏密画线；线条用 non-scaling-stroke 保持 1px，缩小时也看得见
  let step = G;
  if ((bb.w + bb.h) / step > 1400) step = G * 5;               // 太密时只画 5 格的主线，避免上万个元素
  const x0 = Math.floor(bb.x/step)*step, x1 = Math.ceil((bb.x+bb.w)/step)*step;
  const y0 = Math.floor(bb.y/step)*step, y1 = Math.ceil((bb.y+bb.h)/step)*step;
  const major = v => Math.abs(v % (G*5)) < .001 || Math.abs(Math.abs(v % (G*5)) - G*5) < .001;
  let out = '';
  for (let x = x0; x <= x1; x += step)
    out += `<line x1="${x}" y1="${y0}" x2="${x}" y2="${y1}" stroke="${major(x) ? '#d2c7b4' : '#e9e3d7'}" stroke-width="${major(x) ? 1.4 : 1}" vector-effect="non-scaling-stroke"/>`;
  for (let y = y0; y <= y1; y += step)
    out += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${major(y) ? '#d2c7b4' : '#e9e3d7'}" stroke-width="${major(y) ? 1.4 : 1}" vector-effect="non-scaling-stroke"/>`;
  // 网格单位标注（跟着图缩放，和尺寸标注一致）
  const lb = G >= 1000 ? (G/1000) + ' m' : G + ' mm';
  out += `<text x="${x0 + 260}" y="${y0 + 620}" font-size="300" fill="#b3a894">${esc(tr('网格', 'Grid'))} ${lb}</text>`;
  $('#gGrid').innerHTML = bg + out;
}

function renderMeasure(){
  const k = 1/view.s, fs = 12*k;
  const one = (a,b,tmp) => {
    const L = Math.hypot(b.x-a.x, b.y-a.y); if (L < 1) return '';
    let ang = Math.atan2(b.y-a.y, b.x-a.x)*180/Math.PI; if (ang > 90 || ang < -90) ang += 180;
    const mx = (a.x+b.x)/2, my = (a.y+b.y)/2, nx = -(b.y-a.y)/L*5*k, ny = (b.x-a.x)/L*5*k;
    const col = tmp ? '#2f5d62' : '#b5653a', S = `stroke="${col}" stroke-width="1.5" vector-effect="non-scaling-stroke"`;
    return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" ${S}/>
      <line x1="${a.x-nx}" y1="${a.y-ny}" x2="${a.x+nx}" y2="${a.y+ny}" ${S}/><line x1="${b.x-nx}" y1="${b.y-ny}" x2="${b.x+nx}" y2="${b.y+ny}" ${S}/>
      <text x="${mx}" y="${my-5*k}" font-size="${fs}" text-anchor="middle" fill="${col}" font-weight="600" transform="rotate(${ang} ${mx} ${my})"
        stroke="#fff" stroke-width="${3.5*k}" paint-order="stroke">${Math.round(L)} mm</text>`;
  };
  let s = state.measures.map(m => one(m.a,m.b)).join('');
  if (ui.mA && ui.mCur) s += one(ui.mA, ui.mCur, true);
  if (ui.mA) s += `<circle cx="${ui.mA.x}" cy="${ui.mA.y}" r="${3*k}" fill="#2f5d62"/>`;
  $('#gMeasure').innerHTML = s;
}

function renderSel(){
  const k = 1/view.s; let s = '';
  if (ui.sel?.kind === 'furn'){
    const f = getF(ui.sel.id);
    if (f){
      // 触屏上手柄更大、离家具更远，并各带一圈透明的大热区
      const p = 5*k, A = 'stroke="#b5653a" vector-effect="non-scaling-stroke"', hs = COARSE ? 1.7 : 1, ro = (COARSE ? 40 : 26)*k, hit = (COARSE ? 24 : 11)*k;
      const sx = f.w/2+p, sy = f.d/2+p;
      s += `<g transform="translate(${f.cx} ${f.cy}) rotate(${f.rot})">
        <rect x="${-f.w/2-p}" y="${-f.d/2-p}" width="${f.w+2*p}" height="${f.d+2*p}" fill="none" ${A} stroke-width="1.5" stroke-dasharray="5 3" pointer-events="none"/>
        <line x1="0" y1="${-f.d/2-p}" x2="0" y2="${-f.d/2-ro}" ${A} stroke-width="1" pointer-events="none"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${hit}" fill="transparent"/>
        <circle data-handle="rot" cx="0" cy="${-f.d/2-ro}" r="${6*hs*k}" fill="#fff" ${A} stroke-width="1.5"><title>${tr('拖动旋转（Shift 自由角度）','Drag to rotate (Shift for free angle)')}</title></circle>
        <circle data-handle="size" cx="${sx}" cy="${sy}" r="${hit}" fill="transparent"/>
        <rect data-handle="size" x="${sx-5*hs*k}" y="${sy-5*hs*k}" width="${10*hs*k}" height="${10*hs*k}" fill="#b5653a"><title>${tr('拖动调整尺寸','Drag to resize')}</title></rect></g>`;
      const {hh} = aabb(f);
      s += `<text x="${f.cx}" y="${f.cy+hh+24*k}" font-size="${12*k}" text-anchor="middle" fill="#b5653a" font-weight="600" pointer-events="none"
        stroke="#fff" stroke-width="${3*k}" paint-order="stroke">${f.w} × ${f.d}</text>`;
    }
  } else if (ui.sel?.kind === 'room'){
    const r = ROOMS.find(r => r.id === ui.sel.id);
    s += `<polygon points="${r.poly.map(p=>p.join(',')).join(' ')}" fill="rgba(181,101,58,.08)" stroke="#b5653a" stroke-width="2" vector-effect="non-scaling-stroke" pointer-events="none"/>`;
  }
  $('#gSel').innerHTML = s;
}

  $('#undo').style.opacity = undoStack.length ? 1 : .4; $('#redo').style.opacity = redoStack.length ? 1 : .4;

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function overviewPanel(){
  const rows = ROOMS.map(r => {
    const st = state.rooms[r.id];
    return `<tr class="click" data-room="${r.id}"><td><span class="sw" style="background:${MATS[st.mat].sw}"></span>${esc(nm(st.name))}${r.counted===false?' <span class="muted">*</span>':''}</td>
      <td class="r">${fmt(area(r.poly))} m²</td></tr>`;
  }).join('');
  const tot = ROOMS.filter(r => r.counted !== false).reduce((a,r) => a + area(r.poly), 0);
  const byMat = {};
  ROOMS.forEach(r => { const m = state.rooms[r.id].mat; byMat[m] = (byMat[m]||0) + area(r.poly); });
  let cost = 0;

const PANES = 'huxing-panes';
const panes = (() => { try { return JSON.parse(localStorage.getItem(PANES)) || {}; } catch(e) { return {}; } })();
function drawer(which, open){
  const app = $('.app'), els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  if (n){
    Object.entries(els).forEach(([k, el]) => el.classList.toggle('open', k === which && (open ?? !el.classList.contains('open'))));
  } else {
    Object.values(els).forEach(el => el.classList.remove('open'));
    if (which){
      const k = which === 'lib' ? 'hideLib' : 'hidePanel';
      panes[k] = open === undefined ? !panes[k] : !open;
      try { localStorage.setItem(PANES, JSON.stringify(panes)); } catch(e) {}
    }
  }
  app.classList.toggle('hide-lib', !!panes.hideLib); app.classList.toggle('hide-panel', !!panes.hidePanel);
  syncPaneBtns();
}
function syncPaneBtns(){
  const els = {lib:$('aside.lib'), panel:$('aside.right')}, n = narrow();
  const vis = k => n ? els[k].classList.contains('open') : !panes[k === 'lib' ? 'hideLib' : 'hidePanel'];
  $('#tgLib').classList.toggle('on', vis('lib')); $('#tgPanel').classList.toggle('on', vis('panel'));
  $('#tgLib').title = vis('lib') ? tr('收起家具库 ( [ )', 'Hide library ( [ )') : tr('展开家具库 ( [ )', 'Show library ( [ )');
  $('#tgPanel').title = vis('panel') ? tr('收起属性面板 ( ] )', 'Hide properties ( ] )') : tr('展开属性面板 ( ] )', 'Show properties ( ] )');
  $('#stage').classList.toggle('drawer-panel', n && vis('panel'));   // 属性抽屉盖住画面时让出底部工具条
}

  if (ui.sel?.kind === 'furn'){ const id = ui.sel.id; ui.sel = null; mutate(() => state.furniture = state.furniture.filter(f => f.id !== id)); return; }
  if (ui.sel && (PLAN_KINDS.includes(ui.sel.kind) || ui.sel.kind === 'img' || ui.sel.kind === 'room')) deletePlanSel();
}
function duplicateSel(){
  if (ui.sel?.kind !== 'furn') return;
  const f = getF(ui.sel.id), n = {...f, id:uid(), cx:f.cx+200, cy:f.cy+200};
  ui.sel = {kind:'furn', id:n.id}; mutate(() => state.furniture.push(n));
}
// 新放下的家具若压在墙 / 窗上，沿穿透较浅的方向推出来，刚好贴墙
function pushOut(f){
  for (let n = 0; n < 4; n++){
    let moved = false;
    for (const r of snapRects()){
      const {hw, hh} = aabb(f), ox = Math.min(f.cx+hw, r[2]) - Math.max(f.cx-hw, r[0]), oy = Math.min(f.cy+hh, r[3]) - Math.max(f.cy-hh, r[1]);
      if (ox <= 0 || oy <= 0) continue;
      if (ox < oy) f.cx = f.cx < (r[0]+r[2])/2 ? r[0]-hw : r[2]+hw;
      else f.cy = f.cy < (r[1]+r[3])/2 ? r[1]-hh : r[3]+hh;
      moved = true;
    }
    if (!moved) return;
  }
}
function addItem(it, x, y){
  const [type,name,w,d,color] = it, f = F(type,name,Math.round(x/10)*10,Math.round(y/10)*10,w,d,0,color);
  pushOut(f);
  ui.sel = {kind:'furn', id:f.id};
  mutate(() => type==='rug' ? state.furniture.unshift(f) : state.furniture.push(f));
  toast(tr(`已添加「${name}」${w}×${d}`, `Added "${nm(name)}" ${w}×${d}`));
}

  const on = state.demolished.includes(id);
  mutate(() => state.demolished = on ? state.demolished.filter(x => x!==id) : [...state.demolished, id]);
  toast(on ? tr('已恢复墙体', 'Wall restored') : tr(`已标记拆除 ${Math.max(w[2]-w[0], w[3]-w[1])} mm 墙体`, `Marked ${Math.max(w[2]-w[0], w[3]-w[1])} mm of wall for removal`));

/* ======================= 视图 ======================= */
function applyView(){
  const W = svg.clientWidth, H = svg.clientHeight;
  svg.setAttribute('viewBox', `${view.x0} ${view.y0} ${W/view.s} ${H/view.s}`);
  const ratio = 1/(view.s*PX_MM);
  $('#ratio').textContent = '1:' + Math.round(ratio);
  const nice = [100,200,500,1000,2000,5000].find(v => v*view.s >= 60) || 5000;
  $('#sbBar').style.width = nice*view.s + 'px';
  $('#sbText').textContent = nice >= 1000 ? `${nice/1000} m` : `${nice} mm`;
  renderSel(); renderMeasure();
}
function fitView(){
  const W = svg.clientWidth, H = svg.clientHeight, B = planBounds();
  view.s = Math.min(W/B.w, H/B.h);
  view.x0 = B.x - (W/view.s - B.w)/2; view.y0 = B.y - (H/view.s - B.h)/2;
  applyView();
}
function zoomAt(ns, mx, my){
  ns = Math.max(.012, Math.min(2, ns));
  const px = view.x0 + mx/view.s, py = view.y0 + my/view.s;
  view.s = ns; view.x0 = px - mx/ns; view.y0 = py - my/ns; applyView();
}
const zoomCenter = k => zoomAt(view.s*k, svg.clientWidth/2, svg.clientHeight/2);
const setRatio = r => zoomAt(1/(r*PX_MM), svg.clientWidth/2, svg.clientHeight/2);

function toMM(e){
  const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
  return pt.matrixTransform(svg.getScreenCTM().inverse());
}

/* ======================= 吸附 ======================= */
const grid = () => ui.grid;
// 自动贴合（#snapBtn）：按网格步长取整；关闭时几乎不取整（0.1 mm）
const snapG = v => ui.snap ? Math.round(v/ui.grid)*ui.grid : v;
function snapMove(f, cx, cy){
  let nx = snapG(cx), ny = snapG(cy);
  if (!ui.snap || !ui.layers.wallSnap) return [nx, ny];
  const {hw, hh} = aabb(f), tol = 10/view.s;
  let bx = tol, by = tol;
  for (const r of snapRects()){
    if (!(r[3] < cy-hh-tol || r[1] > cy+hh+tol)) for (const ex of [r[0], r[2]]) for (const c of [ex+hw, ex-hw]) if (Math.abs(c-cx) < bx){ bx = Math.abs(c-cx); nx = c; }
    if (!(r[2] < cx-hw-tol || r[0] > cx+hw+tol)) for (const ey of [r[1], r[3]]) for (const c of [ey+hh, ey-hh]) if (Math.abs(c-cy) < by){ by = Math.abs(c-cy); ny = c; }
  }
  return [nx, ny];
}
function snapPoint(p, shift){
  let x = snapG(p.x), y = snapG(p.y);
  if (!ui.snap) return {x, y};                       // 自动贴合关闭：不吸附网格与墙体
  const tol = 8/view.s; let bx = tol, by = tol;
  for (const r of snapRects()){
    for (const ex of [r[0], r[2]]) if (Math.abs(ex-p.x) < bx){ bx = Math.abs(ex-p.x); x = ex; }
    for (const ey of [r[1], r[3]]) if (Math.abs(ey-p.y) < by){ by = Math.abs(ey-p.y); y = ey; }
  }
  if (shift && ui.mA){ if (Math.abs(x-ui.mA.x) > Math.abs(y-ui.mA.y)) y = ui.mA.y; else x = ui.mA.x; }
  return {x, y};
}

/* ======================= 户型编辑：导入户型图 + 鼠标改户型 ======================= */
const PLAN_TOOLS = ['plan', 'wall', 'room', 'roomPoly', 'opening', 'calib'];
const PLAN_KINDS = ['wall', 'win', 'door', 'slide'];

/* ---------- 小几何工具 ---------- */
function pointInPoly(p, poly){
  let inside = false;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
    if ((yi > p.y) !== (yj > p.y) && p.x < (xj - xi) * (p.y - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
function centroid(poly){
  let a = 0, cx = 0, cy = 0;
  for (let i = 0, j = poly.length - 1; i < poly.length; j = i++){
    const x0 = poly[j][0], y0 = poly[j][1], x1 = poly[i][0], y1 = poly[i][1], f = x0*y1 - x1*y0;
    a += f; cx += (x0+x1)*f; cy += (y0+y1)*f;

  return [Math.round(cx/(3*a)), Math.round(cy/(3*a))];
}
function rectOf(kind, i){
  if (kind === 'wall') return WALLS[i] || null;
  if (kind === 'win') return WINS[i] || null;
  if (kind === 'slide') return SLIDES[i] ? SLIDES[i].rect : null;
  if (kind === 'door') return DOORS[i] ? DOORS[i].rect : null;
  return null;                                   // img 等没有矩形语义的元素
}
function kindLabel(kind){
  return {wall:tr('墙体','Wall'), win:tr('窗户','Window'), door:tr('门','Door'), slide:tr('推拉门','Slider'),
          room:tr('房间','Room'), img:tr('户型图','Floor plan')}[kind] || kind;
}
/* 某根轴上出现过的所有坐标：画新墙 / 新房间时用来吸附对齐 */
function axisCoords(axis){
  const k = axis === 'x' ? 0 : 1, out = [];
  const add = r => { out.push(r[k]); out.push(r[k+2]); };
  WALLS.forEach(add); WINS.forEach(add); SLIDES.forEach(s => add(s.rect)); DOORS.forEach(d => add(d.rect));
  ROOMS.forEach(r => r.poly.forEach(p => out.push(p[k])));
  return out;
}
/* 移动一根轴线：位于 x=v（或 y=v）上的全部几何一起挪 d。
 * 规整户型里这就是“改一根轴线”——连着的墙自动伸缩、房间边界跟着走，改完仍然横平竖直。 */
function moveLine(axis, v, d){
  if (!d) return;
  const k = axis === 'x' ? 0 : 1, hit = c => Math.abs(c - v) <= 1;
  const rect = r => { if (hit(r[k])) r[k] += d; if (hit(r[k+2])) r[k+2] += d; };
  WALLS.forEach(rect); WINS.forEach(rect); SLIDES.forEach(s => rect(s.rect)); DOORS.forEach(o => rect(o.rect));
  DOORS.forEach(o => { if (hit(o.h[k])) o.h[k] += d; });
  ROOMS.forEach(r => { r.poly.forEach(p => { if (hit(p[k])) p[k] += d; }); if (r.at && hit(r.at[k])) r.at[k] += d; });
}
function movePoint(x, y, dx, dy){ moveLine('x', x, dx); moveLine('y', y, dy); }
/* 刚体平移：矩形整体挪走，落在它里面（含容差）的其它点一起跟着走 —— 相接的墙被拉伸、房间边界跟随 */
function moveRigid(r, dx, dy, tol){
  if (!dx && !dy) return;
  tol = tol || 40;
  const bx0 = r[0], by0 = r[1], bx1 = r[2], by1 = r[3];
  const near = (x, y) => x >= bx0-tol && x <= bx1+tol && y >= by0-tol && y <= by1+tol;
  const rect = q => {
    const x0 = q[0], y0 = q[1], x1 = q[2], y1 = q[3];
    const m00 = near(x0,y0), m10 = near(x1,y0), m11 = near(x1,y1), m01 = near(x0,y1);
    if (m00 || m01) q[0] += dx;
    if (m10 || m11) q[2] += dx;
    if (m00 || m10) q[1] += dy;
    if (m01 || m11) q[3] += dy;
  };
  WALLS.forEach(rect); WINS.forEach(rect); SLIDES.forEach(s => rect(s.rect)); DOORS.forEach(o => rect(o.rect));
  DOORS.forEach(o => { if (near(o.h[0], o.h[1])){ o.h[0] += dx; o.h[1] += dy; } });
  ROOMS.forEach(rr => {
    rr.poly.forEach(p => { if (near(p[0], p[1])){ p[0] += dx; p[1] += dy; } });
    if (rr.at && near(rr.at[0], rr.at[1])){ rr.at[0] += dx; rr.at[1] += dy; }

/* ---------- 房间与周边墙：拖房间只动这一圈墙，别的房间和墙一动不动 ----------
 * 旧做法是“移动一根轴线”，全局所有落在该坐标上的几何都跟着走 —— 于是拖一个房间会
 * 把别的房间的边界、甚至墙的厚度一起改掉。这里改成房间自己的一圈墙：
 *  · 整体拖动：房间 + 周边墙刚性平移，墙的长度、厚度都不变；
 *  · 拖角点改尺寸：垂直于被拖边的墙整体平移（厚度不变），平行于被拖边的墙只改端头长度。 */
const RTOUCH = 3;                                   // 墙面与房间边线的重合容差（mm）
function wallOnRoom(w, poly, tol){
  tol = tol || RTOUCH;
  const n = poly.length;
  for (let i = 0; i < n; i++){
    const a = poly[i], b = poly[(i+1)%n];
    if (Math.abs(a[1]-b[1]) <= tol){               // 房间的水平边
      const y = a[1], lo = Math.min(a[0],b[0]), hi = Math.max(a[0],b[0]);
      if ((Math.abs(w[1]-y) <= tol || Math.abs(w[3]-y) <= tol) && Math.min(w[2],hi) - Math.max(w[0],lo) > 1) return true;
    } else if (Math.abs(a[0]-b[0]) <= tol){        // 房间的竖直边
      const x = a[0], lo = Math.min(a[1],b[1]), hi = Math.max(a[1],b[1]);
      if ((Math.abs(w[0]-x) <= tol || Math.abs(w[2]-x) <= tol) && Math.min(w[3],hi) - Math.max(w[1],lo) > 1) return true;
    }
  }
  return false;
}
function roomWallIdx(poly){ const out = []; WALLS.forEach((w, i) => { if (wallOnRoom(w, poly)) out.push(i); }); return out; }
/* 落在某面墙里的门窗：墙整体平移时跟着墙走 */
function opensInWall(w){
  const ex = [w[0]-30, w[1]-30, w[2]+30, w[3]+30], sel = {win:[], slide:[], door:[]};
  const inR = r => r[0] >= ex[0] && r[1] >= ex[1] && r[2] <= ex[2] && r[3] <= ex[3];
  WINS.forEach((r, i) => { if (inR(r)) sel.win.push(i); });
  SLIDES.forEach((s, i) => { if (inR(s.rect)) sel.slide.push(i); });
  DOORS.forEach((o, i) => { if (inR(o.rect)) sel.door.push(i); });
  return sel;
}
function shiftOpens(sel, dx, dy){
  if (!dx && !dy) return;
  const mv = r => { r[0] += dx; r[1] += dy; r[2] += dx; r[3] += dy; };
  sel.win.forEach(i => WINS[i] && mv(WINS[i]));
  sel.slide.forEach(i => SLIDES[i] && mv(SLIDES[i].rect));
  sel.door.forEach(i => { const o = DOORS[i]; if (o){ mv(o.rect); o.h[0] += dx; o.h[1] += dy; } });
}
/* 拖房间角点：被拖的两条边是 ex / ey，墙按“垂直就整体平移、平行就改端头”处理 */
function adjustWallForEdge(w, ex, ey, ddx, ddy){
  if (!w) return;
  const nX0 = Math.abs(w[0]-ex) <= 1, nX1 = Math.abs(w[2]-ex) <= 1;
  const nY0 = Math.abs(w[1]-ey) <= 1, nY1 = Math.abs(w[3]-ey) <= 1;
  const sx = w[2]-w[0], sy = w[3]-w[1];
  const vert = Math.abs(sx) <= Math.abs(sy), horz = Math.abs(sy) <= Math.abs(sx);   // 等边的小角柱两边都算：整体跟着角走
  if (vert && (nX0 || nX1)){ w[0] += ddx; w[2] += ddx; }  // 竖墙贴在移动的竖线上 → 整体横移，厚度不变
  else {                                                  // 横墙的端头在这条竖线上 → 只改长度（不许翻面 / 退化成零长）
    const g = Math.sign(sx) || 1, a = w[0] + ddx, b = w[2] + ddx;
    if (nX0 && (w[2]-a)*g >= 1) w[0] = a;
    if (nX1 && (b-w[0])*g >= 1) w[2] = b;
  }
  if (horz && (nY0 || nY1)){ w[1] += ddy; w[3] += ddy; }  // 横墙贴在移动的横线上 → 整体纵移，厚度不变
  else {
    const g = Math.sign(sy) || 1, a = w[1] + ddy, b = w[3] + ddy;
    if (nY0 && (w[3]-a)*g >= 1) w[1] = a;
    if (nY1 && (b-w[1])*g >= 1) w[3] = b;

}
/* 邻居房间的包围盒；withAlcove=false 时忽略飘窗（counted:false 的附属空间，会跟着房间一起走） */
function otherBoxes(id, withAlcove){
  return ROOMS.filter(r => r.id !== id && (withAlcove || r.counted !== false)).map(r => bbox(r.poly));
}
/* 紧贴这个房间边界、且不单独计面积的飘窗 */
function alcovesOf(poly){
  const b = bbox(poly), out = [];
  ROOMS.forEach((r, i) => {
    if (r.counted !== false) return;
    const o = bbox(r.poly);
    const touchX = (Math.abs(o[0]-b[2]) <= RTOUCH || Math.abs(o[2]-b[0]) <= RTOUCH) && Math.min(b[3],o[3]) - Math.max(b[1],o[1]) > 1;
    const touchY = (Math.abs(o[1]-b[3]) <= RTOUCH || Math.abs(o[3]-b[1]) <= RTOUCH) && Math.min(b[2],o[2]) - Math.max(b[0],o[0]) > 1;
    if (touchX || touchY) out.push(i);
  });
  return out;
}
/* 这个房间在各个方向上最多能挪到哪：碰到邻居就停住（不重叠），正好贴上去 */
function roomLimits(bb, objs){
  let minX = -1e9, maxX = 1e9, minY = -1e9, maxY = 1e9;
  for (const ob of objs){
    if (Math.min(bb[3], ob[3]) - Math.max(bb[1], ob[1]) > 0){
      if (ob[2] <= bb[0] + 1) minX = Math.max(minX, ob[2]);
      if (ob[0] >= bb[2] - 1) maxX = Math.min(maxX, ob[0]);
    }
    if (Math.min(bb[2], ob[2]) - Math.max(bb[0], ob[0]) > 0){
      if (ob[3] <= bb[1] + 1) minY = Math.max(minY, ob[3]);
      if (ob[1] >= bb[3] - 1) maxY = Math.min(maxY, ob[1]);
    }
  }
  return {minX, maxX, minY, maxY};
}
/* 整体拖动房间：房间 + 周边墙一起走，墙的长宽厚都不变；撞到别的房间就停住 */
function translateRoom(d, dx0, dy0){
  const op = d.origPoly, r = ROOMS.find(q => q.id === d.roomId);
  if (!op || !r) return false;
  const bb = bbox(op), lim = roomLimits(bb, otherBoxes(d.roomId, false));
  let dx = ui.snap ? Math.round(dx0/ui.grid)*ui.grid : dx0;
  let dy = ui.snap ? Math.round(dy0/ui.grid)*ui.grid : dy0;
  dx = Math.max(lim.minX - bb[0], Math.min(lim.maxX - bb[2], dx));
  dy = Math.max(lim.minY - bb[1], Math.min(lim.maxY - bb[3], dy));
  if (Math.abs(dx) < .5 && Math.abs(dy) < .5) return false;
  r.poly = op.map(([x,y]) => [x+dx, y+dy]);
  if (r.at) r.at = [r.at[0]+dx, r.at[1]+dy];
  (d.alc || []).forEach(i => {                    // 相连的飘窗跟着房间一起走（它的墙已并入 d.wi，不会平移两次）
    const a = ROOMS[i]; if (!a) return;
    a.poly = a.poly.map(([x,y]) => [x+dx, y+dy]);
    if (a.at) a.at = [a.at[0]+dx, a.at[1]+dy];
  });
  (d.wi || []).forEach(i => {
    const w = WALLS[i]; if (!w) return;
    const sel = opensInWall(w);
    shiftOpens(sel, dx, dy);
    w[0] += dx; w[1] += dy; w[2] += dx; w[3] += dy;
  });

}
/* 拖房间角点：改这个房间的开间/进深，周边墙厚度不变、跟着贴合 */
function resizeRoom(d, dx0, dy0){
  const op = d.origPoly, r = ROOMS.find(q => q.id === d.roomId);
  if (!op || !r) return false;
  const bb = bbox(op), c = d.corner || [0,0];
  const ex = c[0] ? bb[2] : bb[0], ey = c[1] ? bb[3] : bb[1];
  const lim = roomLimits(bb, otherBoxes(d.roomId, true)), MIN = 600;
  let nx = snap10(ex + dx0), ny = snap10(ey + dy0);
  if (c[0]) nx = Math.max(bb[0]+MIN, Math.min(lim.maxX, nx));
  else      nx = Math.min(bb[2]-MIN, Math.max(lim.minX, nx));
  if (c[1]) ny = Math.max(bb[1]+MIN, Math.min(lim.maxY, ny));
  else      ny = Math.min(bb[3]-MIN, Math.max(lim.minY, ny));
  const ddx = nx - ex, ddy = ny - ey;
  if (!ddx && !ddy) return false;
  r.poly = op.map(([x,y]) => [x === ex ? x+ddx : x, y === ey ? y+ddy : y]);
  (d.wi || []).forEach(i => {
    const w = WALLS[i]; if (!w) return;
    const old = w.slice();
    adjustWallForEdge(w, ex, ey, ddx, ddy);
    const mx = w[0]-old[0], my = w[1]-old[1];
    if ((mx || my) && mx === w[2]-old[2] && my === w[3]-old[3]) shiftOpens(opensInWall(old.slice(0,4)), mx, my);   // 墙整体平移时，墙里的门窗跟着走
  });

/* 房间标注点被改到墙外时拉回形心 */
function fixRooms(){
  ROOMS.forEach(r => {
    if (!r.at) return;
    if (!pointInPoly({x:r.at[0], y:r.at[1]}, r.poly)) r.at = centroid(r.poly);
  });
}
function fixDoors(){
  DOORS.forEach(o => {
    const x0 = o.rect[0], y0 = o.rect[1], x1 = o.rect[2], y1 = o.rect[3];
    o.h[0] = Math.min(Math.max(o.h[0], x0), x1);
    o.h[1] = Math.min(Math.max(o.h[1], y0), y1);

/* 洞口所在的墙（新开洞口的可滑范围就是它） */
function wallOf(rect){
  const cx = (rect[0]+rect[2])/2, cy = (rect[1]+rect[3])/2;
  let best = -1, sa = Infinity;
  WALLS.forEach((w, i) => {
    if (cx < w[0]-80 || cx > w[2]+80 || cy < w[1]-80 || cy > w[3]+80) return;

function hitPlanElement(p){
  const tol = 6/view.s;

  for (let i = 0; i < DOORS.length; i++) if (inR(DOORS[i].rect, tol)) return {kind:'door', i};

    if (!drag.moved && !far) return;
    drag.moved = true; svg.classList.add('panning');
    view.x0 = drag.x0 - (e.clientX-drag.sx)/view.s; view.y0 = drag.y0 - (e.clientY-drag.sy)/view.s; applyView(); return;
  }
  const f = getF(drag.id); if (!f) return;
  if (!drag.moved && !far) return;             // 轻点家具不应让它抖动一下
  drag.moved = true;
  if (drag.kind === 'move'){
    [f.cx, f.cy] = snapMove(f, p.x-drag.ox, p.y-drag.oy);
  } else if (drag.kind === 'rot'){
    let a = Math.atan2(p.y-f.cy, p.x-f.cx)*180/Math.PI + 90;
    f.rot = norm(e.shiftKey ? a : Math.round(a/15)*15);
  } else if (drag.kind === 'size'){
    const a = f.rot*Math.PI/180, c = Math.cos(a), s = Math.sin(a);
    const dx = p.x-f.cx, dy = p.y-f.cy, lx = dx*c + dy*s, ly = -dx*s + dy*c;
    const ax = -f.w/2, ay = -f.d/2;
    const nw = Math.max(100, Math.round((lx-ax)/10)*10), nd = Math.max(100, Math.round((ly-ay)/10)*10);
    const mx = ax + nw/2, my = ay + nd/2;
    f.cx += mx*c - my*s; f.cy += mx*s + my*c; f.w = nw; f.d = nd;
  }
  renderFurn(); renderSel();
});

function onPointerEnd(e){
  touches.delete(e.pointerId);
  if (pinch){ if (touches.size < 2) pinch = null; return; }   // 双指结束后，剩下的手指不再触发操作
  endDrag(e.type === 'pointercancel');
}
svg.addEventListener('pointerup', onPointerEnd);
svg.addEventListener('pointercancel', onPointerEnd);

['gesturestart','gesturechange','gestureend'].forEach(t => document.addEventListener(t, e => e.preventDefault()));

svg.addEventListener('dblclick', e => {

/* ======================= 键盘 ======================= */
document.addEventListener('keydown', e => {
  if (e.target.matches('input,select,textarea')) return;
  if (window.View3D?.walking()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  if (mod && k === 'z'){ e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y'){ e.preventDefault(); redo(); return; }
  if (mod && k === 'd'){ e.preventDefault(); duplicateSel(); return; }
  if (mod) return;
  if (k === '[' || k === ']'){ drawer(k === '[' ? 'lib' : 'panel'); return; }
  if (k === 'f' && e.shiftKey){ toggleFullscreen(); return; }
  if (k === 't') setView(is3D() ? '2d' : '3d');
  else if (is3D() && ['v','m','x','f','+','=','-','p','w','g','o'].includes(k)) return;
  else if (k === 'v') setTool('select');
  else if (k === 'm') setTool('measure');
  else if (k === 'x') setTool('demolish');
  else if (k === 'p') setTool('plan');
  else if (k === 'w') setTool('wall');
  else if (k === 'g') setTool('room');
  else if (k === 'o') setTool('opening');
  else if (k === 'f') fitView();
  else if (k === 'r') rotateSel(e.shiftKey ? -90 : 90);
  else if (k === 'enter'){ if (draw?.kind === 'poly'){ e.preventDefault(); closePoly(); } }
  else if (k === 'delete' || k === 'backspace'){ e.preventDefault(); deleteSel(); }
  else if (k === 'escape'){
    if (ui.mA){ ui.mA = null; renderMeasure(); }
    else if (draw){ draw = null; renderPlan(); }
    else { if (ui.tool !== 'select') setTool('select'); select(null); }
  }
  else if (k.startsWith('arrow') && ui.sel?.kind === 'furn'){
    e.preventDefault(); const st = e.shiftKey ? 100 : 10;
    mutate(() => { const f = getF(ui.sel.id); if (k==='arrowleft') f.cx -= st; if (k==='arrowright') f.cx += st; if (k==='arrowup') f.cy -= st; if (k==='arrowdown') f.cy += st; });
  }
  else if (k === '+' || k === '=') zoomCenter(1.25);
  else if (k === '-') zoomCenter(.8);
});

// 家具库拖放：用 pointer 事件实现（iPad 上 HTML5 拖放不可靠）。
// 列表设置了 touch-action:pan-y，竖向滑动交给浏览器滚动（会触发 pointercancel），横向拖动才开始拖放。
let libDrag = null;
// 屏幕坐标 → 户型坐标（mm）。2D 取平面图坐标，3D 取射线与地面的交点；s = 该处每 mm 的屏幕像素数
function dropPoint(x, y){
  const r = $('#stage').getBoundingClientRect();
  if (x < r.left || x > r.right || y < r.top || y > r.bottom) return null;
  if (document.elementFromPoint(x, y)?.closest('aside.open,#fab,#walkOverlay,#joy,#walkExit')) return null;
  if (is3D()) return window.View3D?.groundAt(x, y) || null;
  const p = toMM({clientX:x, clientY:y}); return {x:p.x, y:p.y, s:view.s};
}
addEventListener('pointermove', e => {
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const {it} = libDrag;
  if (!libDrag.ghost){
    if (Math.hypot(e.clientX-libDrag.sx, e.clientY-libDrag.sy) < TAP) return;
    const g = libDrag.ghost = document.createElement('div'); g.id = 'ghost';
    g.innerHTML = `<svg viewBox="${-it[2]/2} ${-it[3]/2} ${it[2]} ${it[3]}">${furnSVG(it[0],it[2],it[3],it[4])}</svg>`;
    document.body.appendChild(g); libDrag.el.classList.add('dragging');
  }
  // 幽灵图按落点处的比例显示真实大小（3D 中近大远小）
  const g = libDrag.ghost, s = Math.max(dropPoint(e.clientX, e.clientY)?.s || (is3D() ? .05 : view.s), .02);
  Object.assign(g.style, {width:Math.max(28, it[2]*s)+'px', height:Math.max(20, it[3]*s)+'px', left:e.clientX+'px', top:e.clientY+'px'});
  const lib = $('aside.lib');
  if (narrow() && lib.classList.contains('open') && e.clientX > lib.getBoundingClientRect().right) drawer(null);   // 拖出抽屉后自动收起
});
function endLibDrag(e, ok){
  if (!libDrag || e.pointerId !== libDrag.id) return;
  const d = libDrag; libDrag = null;
  d.el.classList.remove('dragging');
  if (d.ghost){
    d.ghost.remove();
    if (!ok) return;
    const p = dropPoint(e.clientX, e.clientY);
    if (p) addItem(d.it, p.x, p.y);
    else if (is3D() && e.clientX > $('#stage').getBoundingClientRect().left) toast(tr('请拖到地面上', 'Drop it on the floor'));
    return;
  }
  if (!ok) return;
  // 轻点：放到选中房间中心，否则放到画面中心（3D 取屏幕中心对应的地面位置）
  let p = null;
  if (ui.sel?.kind === 'room'){ const b = bbox(ROOMS.find(r => r.id===ui.sel.id).poly); p = {x:(b[0]+b[2])/2, y:(b[1]+b[3])/2}; }
  else if (is3D()){ const r = $('#stage').getBoundingClientRect(); p = window.View3D.groundAt(r.left + r.width/2, r.top + r.height/2); }
  if (!p) p = {x:view.x0 + svg.clientWidth/2/view.s, y:view.y0 + svg.clientHeight/2/view.s};
  addItem(d.it, p.x, p.y);
  closeDrawers();
}

// 放入：墙体延续已有墙的走向/厚度/类型；房间边贴到附近轴线；门窗必须落在墙上
function planDrop(it, x, y){
  mutate(() => {
    if (it.t === 'wall'){
      let cx = snap10(x), cy = snap10(y), kind = it.kind, th = it.th, hz = true, len = it.len;
      const wi = ui.snap ? wallAt({x, y}, 800) : -1;
      if (wi >= 0){
        const w = WALLS[wi]; hz = (w[2]-w[0]) >= (w[3]-w[1]); kind = w[4];
        if (hz){ th = w[3]-w[1]; cy = (w[1]+w[3])/2; } else { th = w[2]-w[0]; cx = (w[0]+w[2])/2; }
      }
      WALLS.push(hz ? [cx-len/2, cy-th/2, cx+len/2, cy+th/2, kind] : [cx-th/2, cy-len/2, cx+th/2, cy+len/2, kind]);
      fixRooms(); ui.sel = {kind:'wall', i:WALLS.length - 1};
    } else if (it.t === 'room'){
      let x0 = snap10(x) - it.w/2, y0 = snap10(y) - it.d/2, x1 = x0 + it.w, y1 = y0 + it.d;
      if (ui.snap){
        const fit = (a, b, ax) => {
          for (const c of axisCoords(ax)){
            if (Math.abs(c - a) < 300) return [c, c + (b - a)];
            if (Math.abs(c - b) < 300) return [c - (b - a), c];
          }
          return [a, b];
        };
        [x0, x1] = fit(x0, x1, 'x'); [y0, y1] = fit(y0, y1, 'y');
      }
      if (x1 - x0 < 400 || y1 - y0 < 400) return;
      const id = 'r' + Date.now().toString(36);
      ROOMS.push({id, name:liName(it), poly:R(x0, y0, x1, y1), mat:it.mat, at:[(x0+x1)/2, (y0+y1)/2]});
      state.rooms[id] = {name:liName(it), mat:it.mat};
      ui.sel = {kind:'room', id};
    } else {
      const wi = wallAt({x, y}, 1000);
      if (wi < 0){ toast(tr('门窗要放到墙上：请拖到某面墙上', 'Drop windows / doors onto a wall')); return; }
      const w = WALLS[wi], hz = (w[2]-w[0]) >= (w[3]-w[1]);
      const len = Math.min(it.w, (hz ? w[2]-w[0] : w[3]-w[1]) - 20);
      if (len < 200) return;
      let rect;
      if (hz){
        const cx = Math.max(w[0]+len/2, Math.min(w[2]-len/2, snap10(x)));
        rect = [cx-len/2, w[1], cx+len/2, w[3]];
      } else {
        const cy = Math.max(w[1]+len/2, Math.min(w[3]-len/2, snap10(y)));
        rect = [w[0], cy-len/2, w[2], cy+len/2];
      }
      if (it.t === 'win'){ WINS.push([rect[0], rect[1], rect[2], rect[3], it.sill ?? .9]); ui.sel = {kind:'win', i:WINS.length - 1}; }
      else if (it.t === 'slide'){ SLIDES.push({rect, v:!hz}); ui.sel = {kind:'slide', i:SLIDES.length - 1}; }
      else {
        const hp = hz ? [rect[2], (rect[1]+rect[3])/2] : [(rect[0]+rect[2])/2, rect[3]];
        DOORS.push({name:liName(it), rect, h:hp, c: hz ? [0,1] : [1,0], o:doorOpenDir(hp, hz), len, entry:!!it.entry});
        ui.sel = {kind:'door', i:DOORS.length - 1};
      }
    }
  });
  if (ui.sel) toast(tr('已放入：用「户型」(P) 工具可拖动改尺寸，Delete 删除', 'Placed — drag it with the Plan (P) tool, press Delete to remove'));
}

/* ======================= 导入导出 ======================= */
function download(name, blob){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function exportPNG(){
  if (is3D()) return window.View3D.shot();
  const B = planBounds();
  const clone = svg.cloneNode(true), W = 3200, H = Math.round(W*B.h/B.w);
  clone.setAttribute('viewBox', `${B.x} ${B.y} ${B.w} ${B.h}`);
  clone.setAttribute('width', W); clone.setAttribute('height', H);
  clone.querySelector('#gSel').innerHTML = '';
  clone.querySelector('#gPlan')?.remove();
  clone.querySelector('#gGrid').innerHTML = `<rect x="-20000" y="-20000" width="55000" height="55000" fill="${ui.layers.grid?'url(#grid)':'#f7f4ee'}"/>`;
  const bg = document.createElementNS('http://www.w3.org/2000/svg','rect');
  Object.entries({x:-20000,y:-20000,width:55000,height:55000,fill:'#f7f4ee'}).forEach(([k,v]) => bg.setAttribute(k,v));
  clone.insertBefore(bg, clone.querySelector('#gGrid'));
  const img = new Image();
  img.onload = () => {
    const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
    cv.getContext('2d').drawImage(img, 0, 0, W, H);
    cv.toBlob(b => download(tr('户型装修方案', 'floor-plan-design') + '.png', b));
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(new XMLSerializer().serializeToString(clone));
}

/* ======================= 导出 DXF（CAD 图纸） =======================
 * 为什么不是 DWG：DWG 是 Autodesk 的闭源二进制格式，写它需要 ODA Teigha / RealDWG 这类商业 SDK，
 * 单文件离线网页里塞不进去（LibreDWG 的 WASM 版体积大、许可也受限）。
 * DXF 是 DWG 的官方通用交换格式：AutoCAD / 中望CAD / 浩辰CAD / 天正 / BricsCAD / LibreCAD 都能直接打开，
 * 在 CAD 里「另存为 → DWG」就得到 .dwg 了。
 * 默认输出 DXF 2007(AC1021)：从 2007 版起 DXF 的文字就是 UTF-8，中文原样写入，
 * 各家中日韩 CAD 打开都是正常汉字，不会乱码。
 * 另备一份 R12(AC1009) 导出给很老的 CAD：那种版本按代码页读文字，写 UTF-8 中文会乱码，
 * 所以那份全文件只用 ASCII、中文写成 AutoCAD 的 \U+XXXX 转义。
 * 图层：WALL 墙体 / WALL-LOW 矮墙 / DOOR 门(含开启弧线) / WIN 窗 / SLIDE 推拉门 / GLASS 玻璃 /
 *       FURN 家具 / FURN-TXT 家具名 / ROOM-TXT 房间名 / DIM 测量 / IMAGE 底图范围 / TITLE 标题
 * 单位：mm，1:1。平面图 y 轴向下，导出时翻成 CAD 的 y 轴向上，方向与屏幕所见完全一致。 */
const DXF_LAYERS = [['WALL',7],['WALL-LOW',8],['DOOR',3],['WIN',4],['SLIDE',4],['GLASS',5],
  ['FURN',8],['FURN-TXT',8],['ROOM-TXT',2],['DIM',1],['IMAGE',6],['TITLE',7]];
const dxEsc = s => Array.from(String(s)).map(c => c.charCodeAt(0) < 127 ? c : '\\U+' + c.charCodeAt(0).toString(16).toUpperCase().padStart(4, '0')).join('');

function buildDXF(r12){
  const enc = s => r12 ? dxEsc(s) : String(s);     // AC1021 直接用 UTF-8；R12 用 \U+ 转义
  const B = geomBounds();
  let bx0 = B.x, by0 = B.y, bx1 = B.x + B.w, by1 = B.y + B.h;
  state.furniture.forEach(f => { const a = aabb(f);
    bx0 = Math.min(bx0, f.cx - a.hw); by0 = Math.min(by0, f.cy - a.hh);
    bx1 = Math.max(bx1, f.cx + a.hw); by1 = Math.max(by1, f.cy + a.hh); });
  const FX = x => x - bx0, FY = y => by1 - y;                  // 平面(y 向下) → 图纸(y 向上)
  const q = v => (Math.round(v * 100) / 100).toFixed(2);
  const L = [], g = (c, v) => { L.push(String(c), String(v)); };
  const line = (x1, y1, x2, y2, lay) => { g(0,'LINE'); g(8,lay);
    g(10,q(FX(x1))); g(20,q(FY(y1))); g(30,'0.0'); g(11,q(FX(x2))); g(21,q(FY(y2))); g(31,'0.0'); };
  const rect = (x0, y0, x1, y1, lay) => { const a = Math.min(x0,x1), b = Math.min(y0,y1), c = Math.max(x0,x1), d = Math.max(y0,y1);
    line(a,b,c,b,lay); line(c,b,c,d,lay); line(c,d,a,d,lay); line(a,d,a,b,lay); };
  const poly = (pts, lay) => pts.forEach((p, i) => { const n = pts[(i + 1) % pts.length]; line(p[0], p[1], n[0], n[1], lay); });
  const text = (x, y, h, str, lay) => { g(0,'TEXT'); g(8,lay);
    g(10,q(FX(x))); g(20,q(FY(y))); g(30,'0.0'); g(40,q(h)); g(1,enc(str));
    g(50,'0.0'); g(72,'1'); g(73,'2'); g(11,q(FX(x))); g(21,q(FY(y))); g(31,'0.0'); };
  const arc = (cx, cy, r, a1, a2, lay) => { g(0,'ARC'); g(8,lay);
    g(10,q(FX(cx))); g(20,q(FY(cy))); g(30,'0.0'); g(40,q(r)); g(50,q(a1)); g(51,q(a2)); };
  const ang = (vx, vy) => { const a = Math.atan2(-vy, vx) * 180 / Math.PI; return (a % 360 + 360) % 360; };

  /* ---- HEADER ---- */
  g(0,'SECTION'); g(2,'HEADER');
  g(9,'$ACADVER'); g(1,r12 ? 'AC1009' : 'AC1021');            // AC1021(2007+) 文字用 UTF-8；AC1009(R12) 用代码页
  g(9,'$INSUNITS'); g(70,4);                                   // 4 = 毫米
  g(9,'$MEASUREMENT'); g(70,1);
  g(9,'$DWGCODEPAGE'); g(3,'ANSI_1252');
  g(9,'$EXTMIN'); g(10,q(0)); g(20,q(-1500)); g(30,'0.0');
  g(9,'$EXTMAX'); g(10,q(FX(bx1))); g(20,q(FY(by0))); g(30,'0.0');
  g(0,'ENDSEC');
  /* ---- TABLES（线型 + 图层）---- */
  g(0,'SECTION'); g(2,'TABLES');
  g(0,'TABLE'); g(2,'LTYPE'); g(70,1);
  g(0,'LTYPE'); g(2,'CONTINUOUS'); g(70,64); g(3,'Solid line'); g(72,65); g(73,0); g(40,'0.0');
  g(0,'ENDTAB');
  g(0,'TABLE'); g(2,'LAYER'); g(70,DXF_LAYERS.length);
  DXF_LAYERS.forEach(([n, c]) => { g(0,'LAYER'); g(2,n); g(70,0); g(62,c); g(6,'CONTINUOUS'); });
  g(0,'ENDTAB');
  g(0,'ENDSEC');
  /* ---- BLOCKS（空，只为兼容严格解析器）---- */
  g(0,'SECTION'); g(2,'BLOCKS'); g(0,'ENDSEC');
  /* ---- ENTITIES ---- */
  g(0,'SECTION'); g(2,'ENTITIES');
  // 墙体（已拆除的墙不画）
  WALLS.forEach((w, i) => { if (state.demolished.includes('w' + i)) return;
    rect(w[0], w[1], w[2], w[3], w[4] === 'low' ? 'WALL-LOW' : 'WALL'); });
  // 窗：洞口矩形 + 玻璃中线
  WINS.forEach(w => { rect(w[0], w[1], w[2], w[3], 'WIN');
    if (Math.abs(w[3] - w[1]) > Math.abs(w[2] - w[0])) line((w[0]+w[2])/2, w[1], (w[0]+w[2])/2, w[3], 'GLASS');
    else line(w[0], (w[1]+w[3])/2, w[2], (w[1]+w[3])/2, 'GLASS'); });
  // 门：洞口 + 门扇（开启位置）+ 开启弧线
  DOORS.forEach(d => { const r = d.rect, hx = d.h[0], hy = d.h[1];
    const len = d.len || Math.max(Math.abs(r[2]-r[0]), Math.abs(r[3]-r[1]));
    rect(r[0], r[1], r[2], r[3], 'DOOR');
    line(hx, hy, hx + d.o[0]*len, hy + d.o[1]*len, 'DOOR');
    const ac = ang(d.c[0], d.c[1]), ao = ang(d.o[0], d.o[1]);
    let s = ac, e = ao; if (((ao - ac) % 360 + 360) % 360 > 180){ s = ao; e = ac; }
    arc(hx, hy, len, s, e, 'DOOR'); });
  // 推拉门：洞口 + 两扇玻璃
  SLIDES.forEach(sl => { const r = sl.rect; rect(r[0], r[1], r[2], r[3], 'SLIDE');
    if (Math.abs(r[3] - r[1]) > Math.abs(r[2] - r[0])){ const cx = (r[0]+r[2])/2, my = (r[1]+r[3])/2;
      line(cx-45, r[1], cx-45, my, 'GLASS'); line(cx+45, my, cx+45, r[3], 'GLASS'); }
    else { const cy = (r[1]+r[3])/2, mx = (r[0]+r[2])/2;
      line(r[0], cy-45, mx, cy-45, 'GLASS'); line(mx, cy+45, r[2], cy+45, 'GLASS'); } });
  // 家具：按 rot 旋转后的矩形 + 名称（太窄的不写字，免得糊成一团）
  state.furniture.forEach(f => { const a = f.rot * Math.PI / 180, c = Math.cos(a), s = Math.sin(a), hw = f.w/2, hd = f.d/2;
    poly([[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].map(([x, y]) => [f.cx + x*c - y*s, f.cy + x*s + y*c]), 'FURN');
    if (Math.min(f.w, f.d) >= 350) text(f.cx, f.cy, 130, f.name, 'FURN-TXT'); });
  // 房间名 + 面积
  ROOMS.forEach(r => { const at = (r.at && pointInPoly({x:r.at[0], y:r.at[1]}, r.poly)) ? r.at : centroid(r.poly);
    const nmv = (state.rooms[r.id] || {}).name || r.name;
    text(at[0], at[1], 240, nmv, 'ROOM-TXT');
    text(at[0], at[1] + 340, 170, area(r.poly).toFixed(1) + 'm²', 'ROOM-TXT'); });
  // 测量标注
  state.measures.forEach(m => { line(m.a.x, m.a.y, m.b.x, m.b.y, 'DIM');
    const len = Math.hypot(m.b.x - m.a.x, m.b.y - m.a.y);
    if (len > 30) text((m.a.x + m.b.x)/2, (m.a.y + m.b.y)/2 - 170, 170, Math.round(len) + '', 'DIM'); });
  // 户型图底图范围（DXF 不放位图，只标出位置）
  if (state.img && state.img.w) rect(state.img.x, state.img.y, state.img.x + state.img.w, state.img.y + state.img.h, 'IMAGE');
  // 标题（画在图纸下方）
  text(bx0, by1 + 640, 330, tr('三室两厅两卫 · 装修设计平面图', '3BR 2LR 2BA · interior design plan') + tr('（单位 mm · 1:1）', ' (units mm · 1:1)'), 'TITLE');
  text(bx0, by1 + 1080, 210, tr('导出时间 ', 'Exported ') + new Date().toLocaleString('zh-CN') +
    (r12 ? tr(' · DXF R12 · 中文以 Unicode 转义写入，CAD 里可另存为 DWG', ' · DXF R12 · Chinese text uses Unicode escapes; save as DWG in CAD')
         : tr(' · DXF 2007 · 中文为 UTF-8，CAD 里可另存为 DWG', ' · DXF 2007 · Chinese text is UTF-8; save as DWG in CAD')), 'TITLE');
  g(0,'ENDSEC');
  g(0,'EOF');
  return L.join('\r\n') + '\r\n';
}

function exportDXF(r12){
  download(tr('户型装修平面图', 'floor-plan') + (r12 ? '-R12' : '') + '.dxf',
           new Blob([buildDXF(r12)], {type:'application/dxf'}));
  toast(r12 ? tr('已导出 DXF R12（老版本 CAD 用）：中文是 \\U+ 转义写法', 'DXF R12 exported (for very old CAD)')

}

  : {'2d':tr('拖动左侧家具到平面图 · 滚轮缩放 · 拖动空白处平移 · T 切换 3D', 'Drag furniture onto the plan · scroll to zoom · drag empty space to pan · T for 3D'),
